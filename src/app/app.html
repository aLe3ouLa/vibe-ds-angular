<main class="page">
  <ds-card padding="lg">
    <h1>Team settings</h1>

    <ds-input
      label="Team name"
      hint="Shown on your team's public profile"
      [(ngModel)]="teamName"
    />

    <section class="roles">
      <h2>Roles</h2>

      <div class="roles__list">
        @for (role of roles(); track role) {
          <ds-tag
            [dismissible]="true"
            [dismissLabel]="'Remove ' + role"
            (dismissed)="removeRole(role)"
          >
            {{ role }}
          </ds-tag>
        }
      </div>
    </section>

    <div class="actions">
      <ds-button variant="secondary">Cancel</ds-button>
      <ds-button variant="primary">Save changes</ds-button>
    </div>
  </ds-card>
</main>
